<article class="content-card"><a class="card-cover {{ .Section }}" href="{{ .RelPermalink }}" aria-label="{{ .Title }}"><span>{{ .Params.category | default .Section }}</span><strong aria-hidden="true">{{ .Params.symbol | default "↗" }}</strong><span>{{ .Params.period | default (.Date.Format "January 2006") }}</span></a><div class="card-copy"><p class="eyebrow">{{ .Params.category | default .Section }}</p><h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3><p>{{ .Description }}</p><a class="text-link" href="{{ .RelPermalink }}">{{ if eq .Section "post" }}Read post{{ else }}Explore project{{ end }} ↗</a></div></article>
